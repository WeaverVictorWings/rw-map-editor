name: 新功能建议 / Feature request
description: 想要的功能或改进 / An idea for the editor
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: 想做什么 / What do you want to do, description: "说说你想做的地图或遇到的麻烦，比功能名更有用" }
    validations: { required: true }
  - type: textarea
    id: how
    attributes: { label: 你设想的做法 / How it could work }
