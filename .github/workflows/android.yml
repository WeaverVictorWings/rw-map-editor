name: 安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成安卓工程
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: 检查原生桥（排查用）
        run: |
          if [ -f www/capacitor.js ]; then echo "::notice title=capacitor.js::copied $(wc -c < www/capacitor.js) bytes"; else echo "::warning title=capacitor.js::missing"; fi
          if grep -rq SaveFilePlugin android/app/src/main/java; then echo "::notice title=plugin::SaveFilePlugin ok"; else echo "::warning title=plugin::SaveFilePlugin missing"; fi
          echo "::notice title=version::$(grep -o 'versionName "[^"]*"' android/app/build.gradle) $(grep -o 'versionCode [0-9]*' android/app/build.gradle)"

      # 固定签名：每次构建签名相同，新版可以直接覆盖安装。
      # 仓库自带一把公开的签名（只用来保证签名不变）；如果配置了 ANDROID_KEYSTORE_BASE64 等密钥，则改用私有密钥。
      - name: 准备签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_S: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_S: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            { echo "KS_PASS=$KS_PASS_S"; echo "KEY_ALIAS=$KEY_ALIAS_S"; echo "KEY_PASS=$KEY_PASS_S"; } >> $GITHUB_ENV
            echo "::notice title=signing::private key"
          else
            cp android-plugin/signing.keystore android/app/release.keystore
            { echo "KS_PASS=rwmapeditor"; echo "KEY_ALIAS=rwmap"; echo "KEY_PASS=rwmapeditor"; } >> $GITHUB_ENV
            echo "::notice title=signing::fixed public key"
          fi

      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          mkdir -p ../out
          f=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$f" ../out/rw-map-editor.apk
          echo "::notice title=APK::$(basename $f) $(wc -c < ../out/rw-map-editor.apk) bytes"

      - name: 打包网页版（电脑浏览器直接用）
        run: |
          rm -f www/capacitor.js
          cp windows/serve.ps1 windows/Start-Editor.bat www/
          (cd www && zip -qr ../out/rw-map-editor-web.zip .)
          echo "::notice title=web::$(wc -c < out/rw-map-editor-web.zip) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: rw-map-editor
          path: out/*
          if-no-files-found: error

      # 按 package.json 的版本发布（例如 2.0.0 → “2.0”）。同一版本再次构建时，覆盖这个版本的安装包（修复会直接进到同一个版本里）
      - name: 读取版本
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VER=$VER" >> $GITHUB_ENV
          echo "REL_NAME=$(echo $VER | sed 's/\.0$//')" >> $GITHUB_ENV

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.REL_NAME }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body_path: RELEASE_NOTES.md
          files: |
            out/rw-map-editor.apk
            out/rw-map-editor-web.zip
