name: 安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成安卓工程
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: 检查原生桥（排查用）
        run: |
          if [ -f www/capacitor.js ]; then echo "::notice title=capacitor.js::copied $(wc -c < www/capacitor.js) bytes"; else echo "::warning title=capacitor.js::missing"; fi
          NB=android/app/src/main/assets/native-bridge.js
          echo "::notice title=native-bridge::registerPlugin=$(grep -c registerPlugin $NB || true) Plugins=$(grep -c 'Plugins' $NB || true)"
          if grep -rq SaveFilePlugin android/app/src/main/java; then echo "::notice title=plugin::SaveFilePlugin ok"; else echo "::warning title=plugin::SaveFilePlugin missing"; fi

      - name: 准备签名（如果配置了密钥）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "HAS_KEY=1" >> $GITHUB_ENV
          fi

      - name: 构建 APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEY" = "1" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleDebug --no-daemon
          fi
          mkdir -p ../out
          f=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$f" ../out/rw-map-editor.apk
          echo "::notice title=APK::$(basename $f) $(wc -c < ../out/rw-map-editor.apk) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: rw-map-editor-android
          path: out/rw-map-editor.apk
          if-no-files-found: error

      - name: 发布到 Releases（手机上直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 测试版 ${{ github.run_number }}
          prerelease: true
          body: |
            自动构建（提交 ${{ github.sha }}）。下载 rw-map-editor.apk 安装。
            调试版签名每次不同：装新版前先卸载旧版。
          files: out/rw-map-editor.apk
