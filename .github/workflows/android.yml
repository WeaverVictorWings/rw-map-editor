name: 安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成安卓工程
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: 检查原生桥（排查用）
        run: |
          ls -la www
          grep -c "registerPlugin" android/app/src/main/assets/native-bridge.js || true

      - name: 准备签名（如果配置了密钥）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "HAS_KEY=1" >> $GITHUB_ENV
          fi

      - name: 构建 APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEY" = "1" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleDebug --no-daemon
          fi
          mkdir -p ../out
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../out/ \;
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: rw-map-editor-android
          path: out/*.apk
          if-no-files-found: error
