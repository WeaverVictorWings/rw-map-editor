<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>铁锈地图编辑器</title>
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<script src="capacitor.js" onerror="this.remove()"></script>
</head>
<body>
<header id="top">
  <button id="btnMenu" class="ib mobile-only" title="菜单" aria-label="菜单"></button>
  <div class="brand desktop-only"><img class="logo" src="icon.svg" alt=""><span>铁锈地图编辑器</span></div>
  <nav id="menubar" class="desktop-only" aria-label="菜单栏"></nav>
  <div id="title"><span id="mapName" title="点击改名" translate="no"></span><span id="mapSize"></span><span id="saveState"></span></div>
  <button id="btnSearch" class="desktop-only" title="搜索功能 (Ctrl+K)"></button>
  <button id="btnMod" class="pill desktop-only" title="Mod 编辑器：改单位、打包 Mod"></button>
  <button id="btnUndo" class="ib" title="撤销 (Ctrl+Z)" aria-label="撤销"></button>
  <button id="btnRedo" class="ib" title="重做 (Ctrl+Y)" aria-label="重做"></button>
  <button id="btnCheck" class="pill" title="检查地图能不能在游戏里玩">能玩吗？</button>
  <div class="split"><button id="btnSave" class="pill primary" title="保存 (Ctrl+S)">保存</button><button id="btnSaveMore" class="pill primary caret" title="更多保存方式" aria-label="更多保存方式">▾</button></div>
</header>
<nav id="modebar" aria-label="编辑模式"></nav>
<main id="main">
  <aside id="toolbar" aria-label="工具"></aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="mini" title="小地图：点击或拖动跳转"></canvas>
    <div id="zoomctl"></div>
    <div id="selbar" class="floatbar hidden"></div>
    <div id="mstatus"></div>
    <div id="coach" class="hidden"></div>
    <div id="toast"></div>
    <div id="welcome" class="hidden"></div>
  </div>
  <aside id="dock">
    <div id="dockTabs"><span id="dockHandle"></span></div>
    <div id="dockBody"></div>
  </aside>
</main>
<footer id="statusbar"></footer>
<div id="busy" class="hidden"><div><div class="spin"></div><div class="msg">处理中…</div></div></div>
<input type="file" id="fileIn" hidden>
<script type="module" src="js/app.js"></script>
<script>
// 离线网页版（PWA）：用本地静态服务器 / 部署到网站时注册 Service Worker；安卓 App 壳里不注册。
// 断网后所有资源从缓存读，功能不受影响。
if (!window.Capacitor && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (r) {
      if (r && r.waiting) r.waiting.postMessage('skip');
    }).catch(function () {});
  });
}
</script>
</body>
</html>
